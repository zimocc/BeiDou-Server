      text: 哪个升级更快一点？
    - speaker: B
      text: 有宠物捡金币就去打鱼，没有就去幽灵船
    - speaker: A
      text: 好的多谢老哥！
      emote: 2
  class_debate:
    participants: 2
    lines:
    - speaker: A
      text: 新建号玩战士好还是玩法师好？
    - speaker: B
      text: 看你想怎么玩，战士血厚肉盾，法师全屏大招帅气
      emote: 3

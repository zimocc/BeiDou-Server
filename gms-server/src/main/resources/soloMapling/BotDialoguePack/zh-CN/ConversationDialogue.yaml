conversations:
  training_spot_debate:
    participants: 2
    lines:
    - speaker: A
      text: 你平时都在哪练级啊？
    - speaker: B
      text: 大部分时间都在猪猪海岸蹲着
    - speaker: A
      text: 那不会有点慢吗？
      emote: 5

# Generic town small-talk for ambient bot-to-bot conversation (BotChatterSystem).
# Each exchange is an ORDERED back-and-forth; speakers alternate A, B, A, B... (2-4 turns).
# {MAP} resolves to the live map name against the SPEAKING bot; a line whose tokens can't resolve is
# dropped rather than spoken raw. Keep lines short + lowercase (v83 client, no emoji).
# Shared across all towns to start (per-town flavor files can override later). YAML-first; bulk-generate
# more via the dialogue batch-generation playbook. Loaded by TownChatterLines.
exchanges:
  - ["你去过天空之城了吗？", "还没呢，还在攒船票钱", "值得一去，路上的风景太壮观了"]
  - ["披风不错嘛", "多谢，我自己砸卷砸出来的", "手气真好，我砸卷从来都是碎"]
  - ["最近刷怪升级还顺利不？", "有点慢，但还算稳定", "我也差不多，手都按酸了哈哈"]
  - ["今天{MAP}挺热闹的啊", "是啊，看到这么多人真开心", "说实话比一个人单刷有意思多了"]
  - ["你在自由市场摆摊卖东西吗？", "就卖几张卷轴而已", "待会儿我去你摊位逛逛"]
  - ["你转职任务做完了吗？", "昨晚终于搞定了", "恭喜恭喜！我当时也卡了好久"]
  - ["你最近都在哪里练级？", "还是老地方蹲点刷怪", "经典老点位，永远的神"]
  - ["这附近有人去打组队任务吗？", "好像没人，大家都在挂机", "意料之中哈哈"]
  - ["你这身装备看起来真帅", "攒了好几个星期的金币才买齐", "说实话确实挺值的"]
  - ["你注意到今天的掉率了吗？", "对啊，感觉特别大方", "趁现在赶紧多刷会儿"]
  - ["你觉得我需要洗点吗？", "不用洗，你现在加点挺好的", "好吧，听你的"]
  - ["今天{MAP}感觉有点冷清啊", "现在还早呢", "倒也是，晚点人就多起来了"]
  - ["最近这卷轴市价多少了？", "贵得离谱哈哈", "物价真是只涨不跌啊"]
  - ["我老是在那个boss那里翻车", "下次多带点特效药水去", "确实，药不能省"]
  - ["你有公会了吗？", "正在找呢，还没加", "我回公会帮你问问看"]
  - ["有多余的药水吗？", "给你拿几瓶先用着", "救大命了，多谢兄弟"]
  - ["今天累坏了吧？", "是啊，来城里歇会儿吹吹风", "同感，城里呆着挺放松的"]
  - ["这次维护修好延迟卡顿了吗？", "今天感觉顺畅多了", "谢天谢地，之前实在太卡了"]
  - ["你现在多少级了？", "快到下一次转职了", "就差一点了，加油冲"]
  - ["这地图有人刷吗？", "你刷吧，我正准备走呢", "太感谢了，回见"]
  - ["你听说有活动了吗？", "没有啊，什么活动？", "这周末有双倍经验活动"]
  - ["帽子真好看，哪搞的？", "商城的，忍不住就剁手了", "哈哈好看就行"]
  - ["在等人吗？", "没，就站在这看看风景", "哈哈我也是"]
  - ["{MAP}今天天气真好", "要是现实里也是这天气就好了", "哈哈真实了"]

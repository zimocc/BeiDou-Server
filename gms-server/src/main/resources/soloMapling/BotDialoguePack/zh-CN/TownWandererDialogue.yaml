# Shared ambient dialogue for the generic TownWandererBot (roams every town except Henesys, which keeps
# its hand-polished HenesysBot lines). Lines use the {MAP} context token so the same file reads correctly
# in Kerning, Ellinia, Perion, Sleepywood, Orbis, Ludibrium, El Nath. Keep lines town-agnostic — no
# Henesys-specific references. Per-town flavor files can come later via the dialogue batch playbook.
TownWandererBot:
  CongratsLevelUp:
    text:
      - "恭喜升级啊{PLAYER_NAME}！"
      - "厉害，都{PLAYER_LEVEL}级了"
      - "恭喜恭喜！"
      - "哎呀，恭喜升级{PLAYER_NAME}"
      - "这么快就{PLAYER_LEVEL}级了？厉害"
      - "加油冲级啊{PLAYER_NAME}"
      - "太强了！"
      - "恭喜升级！"
      - "干得漂亮，{PLAYER_NAME}"
      - "哇升级了，恭喜{PLAYER_NAME}"
      - "冲冲冲，{PLAYER_NAME}"
      - "都{PLAYER_LEVEL}级了，真不错"
      - "恭喜{PLAYER_NAME}，继续加油"
      - "稳步升到{PLAYER_LEVEL}级了呢"
  PlayerReaction:
    text:
      - "噢，你好呀"
      - "嗨"
      - "你好！"
      - "哟"
      - "路过路过"
      - "借过一下哈"
      - "以前在{MAP}好像没见过你呢"
      - "等等，我们是不是在哪见过？"
      - "哎看路看路哈哈"
      - "{MAP}今天天气真不错啊"
      - "你是新来这里的吗？"
      - "嗯？"
      - "哈哈，又是你呀"
      - "在忙啥呢"
      - "欢迎回来"
      - "今天{MAP}挺安静的"
      - "在外面注意安全哦"
      - "有空一起组队玩吗？"
      - "*挥手*"
      - "好久不见啦"
  WanderChat:
    text:
      - "好吧，我刚才本来打算去哪来着"
      - "唔……走哪边好呢"
      - "就是随便活动活动筋骨"
      - "其实{MAP}真挺不错的"
      - "啦啦啦~"
      - "不知道今天商店有什么特价"
      - "最近{MAP}人好多呀"
      - "我真该回去接着练级了"
      - "*打哈欠*"
      - "这里真安静舒适"
      - "好喜欢{MAP}的这个角落"
      - "大家都跑哪去啦"
      - "又在{MAP}绕了一圈"
      - "这小镇还是一如既往的样子"
      - "好缺金币啊……"
      - "不知道杂货铺进新货了没"
      - "唔……"
      - "随便消磨消磨时间"
  EmoteReaction:
    text:
      - "哈哈"
      - "笑死"
      - "不错嘛"
      - "哦？"
      - "哼！"
      - "嘿嘿"
      - "好吧"
      - "有点意思"
      - "不会吧"
      - ":)"
  MapTransition:
    text:
      - "我去别的地方转悠转悠"
      - "去别处探险咯，拜拜"
      - "马上回来，去确认点事"
      - "我打算去那边看看"
      - "在{MAP}回见啦"
      - "该换个地方了"
      - "回头见！"
      - "去别的地方散散步活动一下"
      - "去个新地方好像挺好玩的"
      - "溜达去咯~"

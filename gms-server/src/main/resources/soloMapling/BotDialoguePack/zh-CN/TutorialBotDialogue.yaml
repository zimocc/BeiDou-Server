TutorialBot:
  Greeting:
    text:
    - 嗨，%RESP_NAME%！欢迎来到北斗冒险岛！
    emote: 2
    wait: 1
  Inquiry:
    text:
    - 这是你第一次来到这个服务器吗？
    emote: 6
    wait: 1
  AskAdmin:
    text:
    - 在开始新手向导之前……
    - 服务器目前处于内测阶段，我们正在招募管理员来协助测试。
    - 你想成为服务器管理员吗？你将获得完整的GM权限以及一套新手开荒装备！
    emote: 6
    wait: 1
  GrantAdmin:
    text:
    - 太棒了！欢迎加入管理员大家庭！
    - 太棒了！已将你的角色提升至150级隐士，并赋予全套GM权限！
    - 给你生成了两组25,000点券兑换码，请记好：
    - '%NX_CODE%'
    - '%NX_CODE_2%'
    - 可以在游戏商城中兑换点券。现在点我交易，我给你拿点补给物资……
    emote: 2
    wait: 2
  GiftTradeIntro:
    text:
    - 接受我的交易请求，我会赠送你大量金币、药水以及极品飞镖！
    emote: 2
    wait: 1
  Tutorial_1:
    text:
    - 要和其他玩家或机器人对话，只需在聊天中喊出他们的名字
    - 例如你想和我对话，在普通聊天框直接输入 %CHR_NAME% 即可
    - 请注意：输入的必须与对方的角色名字完全一致！
    emote: 3
    wait: 1
  Tutorial_2:
    text:
    - 接下来，其他玩家可能会向你发起提问或弹出选项。
    - 回复时，只需输入你想选择的具体选项文本（不区分大小写）
    - 让我们测试一下。你想保留哪一顶帽子？
    emote: 1
    wait: 1
  AnalyzePlayersWeapon:
    text:
    - 你手里拿的那把 %WPN_NAME%……
    - 把它丢在地上，让我帮你看看品质。
    emote: 3
    wait: 1
  LootDialogue:
    text:
    - 唔唔唔……
    - 这是一把崭新的天然 %WPN_NAME%……
    - 看好了！我现在就要用【砸卷的玄学力量】强化它！
    emote: 1
    wait: 6
  UpgradeDialogue:
    text:
    - 砰的一声！搞定！装备已经强化完毕了！
    - 不用谢我，关爱萌新是老玩家的传统美德 :P
    emote: 3
    wait: 1
  ReturnDialogue:
    text:
    - 这次只是我送你的新手福利。
    - 但在外面的冒险世界里，可不会人人都有我这么慷慨哦。
    - 在网络世界里，随时都有居心叵测的人想要占你的便宜。
    - 和其他玩家交易时一定要多长个心眼，防人之心不可无。
    - 衡量一个玩家声誉好坏的重要指标之一就是【人气度（Fame）】。
    - 人气度越高，往往说明该玩家信誉良好、受人欢迎。
    - 反之，人气度很低或者负数的，极大概率是骗子或者恶霸！
    emote: 3
    wait: 1
  SendoffDialogue:
    text:
    - 目前我要指导你的就是这些啦。
    - 我带你到传送口去，跟我来吧。
    emote: 2
    wait: 1
  SendoffPartingGiftDialogue:
    text:
    - 收下这个特殊的苹果作为临别赠礼吧。
    - 收下这个特殊的苹果作为临别赠礼吧。
    - 在你遇到强敌、需要突破极限的时候再吃下它。
    - 祝你在冒险岛的世界里一帆风顺，年轻的冒险家！
    emote: 2
    wait: 1
